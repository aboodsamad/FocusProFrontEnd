    <title>LockedIn</title>
    <link rel="manifest" href="manifest.json" />

  <body>
    <!--
      LockedIn Push Notification Setup
      ─────────────────────────────────
      We register notification_sw.js at scope '/push-sw/'  a scope that is
      SEPARATE from Flutter's flutter_service_worker.js at '/'.
      This prevents Flutter's SW from overwriting ours on every page load.
      Push events are delivered to whichever SW CREATED the subscription,
      so using our own registration means our push handler always runs.

      Dart calls window._LockedIn_subscribePush(vapidKey) and polls
      window._LockedIn_pushResult for the JSON subscription or {error:'...'}.
    -->
    <script>
      window._LockedIn_pushResult = null;

      // Register LockedIn's push SW at '/push-sw/'  completely separate from
      // Flutter's SW at '/'. They coexist without fighting each other.
      var _LockedIn_swReg = null;
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/notification_sw.js", { scope: "/push-sw/" })
          .then(function (reg) {
            _LockedIn_swReg = reg;
            console.log("[LockedIn] Push SW registered, scope:", reg.scope);
          })
          .catch(function (err) {
            console.warn("[LockedIn] Push SW registration failed:", err);
          });
      }

      // Convert a base64url VAPID key string into a Uint8Array.
      function _LockedIn_urlBase64ToUint8Array(base64String) {
        var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        var base64 = (base64String + padding)
          .replace(/-/g, "+")
          .replace(/_/g, "/");
        var raw = window.atob(base64);
        var output = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; ++i) output[i] = raw.charCodeAt(i);
        return output;
      }

      // Called by Dart to create a push subscription using OUR SW (not Flutter's).
      window._LockedIn_subscribePush = function (vapidKey) {
        if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
          window._LockedIn_pushResult = { error: "unsupported" };
          return;
        }
        window._LockedIn_pushResult = null;

        function doSubscribe(reg) {
          // Always unsubscribe first to clear any stale subscription,
          // then create a fresh one tied to our push SW registration.
          reg.pushManager
            .getSubscription()
            .then(function (existing) {
              if (existing) {
                return existing.unsubscribe().then(function () {
                  return null;
                });
              }
              return null;
            })
            .then(function () {
              return reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: _LockedIn_urlBase64ToUint8Array(vapidKey),
              });
            })
            .then(function (sub) {
              window._LockedIn_pushResult = JSON.parse(JSON.stringify(sub));
              console.log(
                "[LockedIn] Push subscription created, endpoint:",
                sub.endpoint.substring(0, 40),
              );
            })
            .catch(function (err) {
              window._LockedIn_pushResult = { error: String(err) };
              console.warn("[LockedIn] Push subscription failed:", err);
            });
        }

        if (_LockedIn_swReg) {
          doSubscribe(_LockedIn_swReg);
        } else {
          navigator.serviceWorker
            .register("/notification_sw.js", { scope: "/push-sw/" })
            .then(function (reg) {
              _LockedIn_swReg = reg;
              doSubscribe(reg);
            })
            .catch(function (err) {
              window._LockedIn_pushResult = { error: String(err) };
              console.warn(
                "[LockedIn] SW registration failed during subscribe:",
                err,
              );
            });
        }
      };
    </script>

    <!--
      Audio unlock: browsers block HTMLAudioElement.play() until the user
      has interacted with the page.  We prime the audio engine on the very
      first pointer-down (which covers both mouse clicks and touch taps)
      so that subsequent just_audio calls succeed without a NotAllowedError.
    -->
    <script>
      document.addEventListener(
        "pointerdown",
        function () {
          var a = new Audio();
          a.play()
            .then(function () {
              a.pause();
            })
            .catch(function () {});
        },
        { once: true, capture: true },
      );
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
